<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>智能知识图谱 | AI学习助手 - 三级联动版</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 左侧控制面板 - 可伸缩 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🌌 智能知识图谱</h1>
                <p class="subtitle">AI识别笔记 · 三级联动 · 层级探索版</p>
            </div>
            
            <!-- 上传区域 -->
            <div class="upload-section">
                <label>📁 上传文件识别知识</label>
                <div class="upload-area" id="uploadArea">
                    <span class="upload-icon">📤</span>
                    <span>点击或拖拽</span>
                    <span class="upload-hint">图片/PDF/Word/Excel/TXT</span>
                    <input type="file" id="fileUpload" accept="image/*,.pdf,.docx,.xlsx,.xls,.txt" multiple hidden>
                </div>
                <div id="uploadProgress" class="upload-progress" style="display:none">
                    <div class="progress-bar"></div>
                </div>
                <div id="uploadResult" class="upload-result"></div>
            </div>

            <!-- 文件管理器 -->
            <div class="file-manager-section">
                <div class="file-manager-header" id="fileManagerHeader">
                    <h3>📂 文件知识库</h3>
                    <button id="downloadAllFilesBtn" class="download-btn">⬇️ 下载</button>
                </div>
                <div id="fileManagerContent" class="file-manager-content" style="display:block;">
                    <div style="padding:8px;text-align:center;color:#6b7280;font-size:0.7rem;">暂无文件</div>
                </div>
            </div>

            <!-- 手动添加 -->
            <div class="input-section">
                <label>✏️ 手动添加</label>
                <div class="keyword-input-group">
                    <input type="text" id="keywordInput" placeholder="例如: 量子纠缠...">
                    <button id="addKeywordBtn">➕</button>
                </div>
            </div>

            <!-- 预设框架 -->
            <div class="preset-section">
                <label>🎯 预设框架</label>
                <div class="preset-buttons">
                    <button class="preset-btn" data-path="physics">⚛️物理</button>
                    <button class="preset-btn" data-path="philosophy">📜哲学</button>
                    <button class="preset-btn" data-path="ai">🤖AI</button>
                    <button class="preset-btn" data-path="history">🏛️历史</button>
                    <button class="preset-btn" data-path="biology">🧬生物</button>
                </div>
            </div>

            <!-- 节点列表 -->
            <div class="node-list-panel">
                <h3>📚 知识宇宙</h3>
                <div class="legend-compact">
                    <span><span class="color-dot red"></span>一级</span>
                    <span><span class="color-dot blue"></span>二级</span>
                    <span><span class="color-dot gray"></span>三级</span>
                </div>
                <ul id="nodeListUl"></ul>
                <div class="node-hint">💡 点击节点展开下级 | 右键删除</div>
            </div>

            <!-- 推荐学习 -->
            <div class="recommend-section">
                <h3>💡 推荐学习</h3>
                <div id="recommendList" class="recommend-list"></div>
            </div>
        </div>

        <!-- 伸缩按钮 -->
        <div class="resize-handle" id="resizeHandle">
            <div class="handle-line"></div>
            <div class="handle-line"></div>
            <div class="handle-line"></div>
        </div>

        <!-- 右侧画布区 -->
        <div class="canvas-container" id="canvasContainer">
            <!-- 每日语录窗口 - 可折叠 -->
            <div class="quote-window" id="quoteWindow">
                <div class="quote-header" id="quoteHeader">
                    <span class="quote-icon">📜</span>
                    <span class="quote-title">每日激励</span>
                    <span class="quote-toggle">▼</span>
                </div>
                <div class="quote-content" id="quoteContent">
                    <div class="quote-text" id="quoteText">加载中...</div>
                    <div class="quote-author" id="quoteAuthor"></div>
                    <div class="quote-explanation" id="quoteExplanation"></div>
                </div>
            </div>

            <div class="toolbar">
                <button id="zoomInBtn">🔍 +</button>
                <button id="zoomOutBtn">🔍 -</button>
                <button id="resetViewBtn">🔄 重置</button>
                <button id="clearAllBtn">🗑️ 清空</button>
                <span id="totalGold">💰 0</span>
            </div>
            <svg id="lineSvg" class="line-layer"></svg>
            <div class="scroll-wrapper" id="scrollWrapper">
                <div id="graphCanvas" class="graph-canvas"></div>
            </div>
        </div>
    </div>

    <!-- 底部搜索栏 -->
    <div class="footer-search">
        <div class="search-wrapper">
            <input type="text" id="searchKeyword" placeholder="🔭 搜索知识点...">
            <div id="goldDisplay" class="gold-display">
                <span class="gold-icon">💰</span>
                <span id="goldValue">0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
