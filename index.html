<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间流失 · 三组 · 排除睡眠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <header>
      <h1>⏳ 时间流失 · 三组</h1>
      <p class="subhead">
        <span>12 周</span> <span>72 小时</span> <span>12 小时</span>
        · 每日排除 <span>8 小时</span> 睡眠
      </p>
    </header>

    <main class="grid" id="timerGrid">
      <!-- 卡片 1: 12周 -->
      <section class="timer-card" data-group="weeks">
        <div class="card-label">
          <span>📅 12 周</span>
          <span class="badge">排除睡眠</span>
        </div>
        <div class="time-display" id="displayWeeks">--:--:--</div>
        <div class="progress-section">
          <div class="progress-bar-bg">
            <div class="progress-fill" id="progressWeeks" style="width: 100%"></div>
          </div>
          <div class="stats">
            <span>剩余</span>
            <span id="percentWeeks">100%</span>
          </div>
        </div>
        <div class="card-footnote">⚡ 每秒更新</div>
      </section>

      <!-- 卡片 2: 72小时 -->
      <section class="timer-card" data-group="hours72">
        <div class="card-label">
          <span>⏰ 72 小时</span>
          <span class="badge">排除睡眠</span>
        </div>
        <div class="time-display" id="displayHours72">--:--:--</div>
        <div class="progress-section">
          <div class="progress-bar-bg">
            <div class="progress-fill" id="progressHours72" style="width: 100%"></div>
          </div>
          <div class="stats">
            <span>剩余</span>
            <span id="percentHours72">100%</span>
          </div>
        </div>
        <div class="card-footnote">⚡ 每秒更新</div>
      </section>

      <!-- 卡片 3: 12小时 -->
      <section class="timer-card" data-group="hours12">
        <div class="card-label">
          <span>⌛ 12 小时</span>
          <span class="badge">排除睡眠</span>
        </div>
        <div class="time-display" id="displayHours12">--:--:--</div>
        <div class="progress-section">
          <div class="progress-bar-bg">
            <div class="progress-fill" id="progressHours12" style="width: 100%"></div>
          </div>
          <div class="stats">
            <span>剩余</span>
            <span id="percentHours12">100%</span>
          </div>
        </div>
        <div class="card-footnote">⚡ 每秒更新</div>
      </section>
    </main>

    <footer>
      <p class="footer-note">
        <i>🛌 睡眠排除</i> 每天 8 小时 (从总时长中扣除) · 初始时间: 此刻
      </p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
