<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>智能知识图谱 | AI学习助手 - 电量灌注版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'SF Pro Text', system-ui, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* ========= 左侧边栏 ========= */
        .sidebar {
            width: 280px;
            min-width: 180px;
            max-width: 450px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid #3b82f6;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 14px;
            z-index: 10;
            transition: width 0.05s ease;
            flex-shrink: 0;
        }

        /* 伸缩按钮 */
        .resize-handle {
            width: 8px;
            background: rgba(59, 130, 246, 0.4);
            cursor: ew-resize;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .resize-handle:hover { background: #3b82f6; }
        .handle-line {
            width: 3px;
            height: 16px;
            background: #93c5fd;
            margin: 2px 0;
            border-radius: 2px;
        }

        .sidebar h1 { font-size: 1.2rem; margin-bottom: 2px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sidebar .subtitle { font-size: 0.6rem; color: #8b9dc3; margin-bottom: 16px; }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
            background: rgba(59,130,246,0.1);
            transition: all 0.2s;
        }
        .upload-area:hover { background: rgba(59,130,246,0.2); border-color: #60a5fa; }
        .upload-icon { font-size: 1.3rem; display: block; }
        .upload-result { font-size: 0.6rem; color: #8b9dc3; margin: 6px 0; padding: 4px; background: rgba(0,0,0,0.3); border-radius: 8px; max-height: 50px; overflow-y: auto; }

        /* 文件管理器 */
        .file-manager { margin-bottom: 12px; }
        .file-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 4px 0; }
        .file-header h3 { font-size: 0.75rem; color: #93c5fd; }
        .file-content { max-height: 80px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-top: 4px; }
        .file-item { font-size: 0.55rem; padding: 2px 5px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .delete-file { background: rgba(239,68,68,0.5); padding: 0 5px; border-radius: 8px; cursor: pointer; font-size: 0.5rem; }

        button {
            background: #3b82f6;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.65rem;
            margin: 2px;
        }
        button:hover { background: #2563eb; }

        .preset-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .preset-btn { background: rgba(59,130,246,0.3); font-size: 0.6rem; }

        .input-group { display: flex; gap: 6px; margin: 10px 0; }
        .input-group input { flex: 1; padding: 5px 10px; border-radius: 20px; border: none; background: rgba(30,30,60,0.8); color: white; outline: none; font-size: 0.65rem; }

        .node-list { margin-top: 12px; max-height: 130px; overflow-y: auto; }
        .node-list li {
            background: rgba(30,30,60,0.5);
            padding: 4px 8px;
            border-radius: 16px;
            margin-bottom: 3px;
            cursor: pointer;
            list-style: none;
            font-size: 0.65rem;
            border-left: 3px solid;
        }
        .node-hint { font-size: 0.5rem; color: #6b7280; margin-top: 6px; text-align: center; }

        /* 推荐学习 */
        .recommend-section { margin-top: 12px; padding: 8px; background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(168,85,247,0.05)); border-radius: 10px; }
        .recommend-section h3 { font-size: 0.65rem; color: #eab308; margin-bottom: 4px; }
        .recommend-list { font-size: 0.55rem; max-height: 70px; overflow-y: auto; }
        .recommend-item { padding: 3px; margin-bottom: 2px; background: rgba(0,0,0,0.3); border-radius: 5px; cursor: pointer; }

        /* ========= 右侧画布 ========= */
        .canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, #0f0f23 0%, #05050a 100%);
            overflow: hidden;
            touch-action: pinch-zoom;
        }

        /* 每日语录 - 右上角 */
        .quote-window {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 25;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid rgba(234, 179, 8, 0.4);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            max-width: 260px;
            min-width: 170px;
        }
        .quote-window.collapsed .quote-content { display: none; }
        .quote-window.collapsed .quote-toggle { transform: rotate(-90deg); }
        .quote-header { padding: 6px 10px; display: flex; align-items: center; gap: 6px; border-radius: 14px; }
        .quote-header:hover { background: rgba(234, 179, 8, 0.15); }
        .quote-icon { font-size: 0.85rem; }
        .quote-title { font-size: 0.65rem; font-weight: 500; color: #eab308; flex: 1; }
        .quote-toggle { font-size: 0.65rem; color: #93c5fd; transition: transform 0.2s; }
        .quote-content { padding: 0 10px 10px 10px; border-top: 1px solid rgba(234,179,8,0.2); }
        .quote-text { font-size: 0.7rem; line-height: 1.35; color: #e0e0e0; font-style: italic; margin-bottom: 4px; }
        .quote-author { font-size: 0.55rem; color: #eab308; text-align: right; margin-bottom: 3px; }
        .quote-explanation { font-size: 0.5rem; color: #8b9dc3; line-height: 1.25; }

        .toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 5px 10px;
            display: flex;
            gap: 6px;
        }
        .toolbar button { background: rgba(59,130,246,0.5); padding: 3px 8px; font-size: 0.6rem; }
        #totalGold { color: #eab308; font-weight: bold; margin-left: 10px; font-size: 0.7rem; }

        /* 画布和缩放容器 */
        .canvas-wrapper {
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }
        .canvas-wrapper:active { cursor: grabbing; }
        
        #graphCanvas {
            position: relative;
            transform-origin: 0 0;
            width: 2000px;
            height: 1500px;
        }

        /* 节点样式 - 椭圆形，电量灌注效果 */
        .node-card {
            position: absolute;
            border-radius: 50px;
            padding: 8px 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: box-shadow 0.1s, transform 0.05s;
            user-select: none;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        .node-card.dragging { opacity: 0.85; cursor: grabbing; z-index: 100; }
        .node-card.highlight { box-shadow: 0 0 20px #eab308; }
        .node-card.path-highlight { box-shadow: 0 0 20px #eab308; border-color: #eab308 !important; }

        /* 电量灌注背景 */
        .node-card .battery-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 100%;
            width: 0%;
            border-radius: 50px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
            opacity: 0.35;
        }
        .node-card .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .node-label { font-weight: 500; font-size: 0.8rem; white-space: nowrap; }
        .node-gold { font-size: 0.55rem; opacity: 0.9; display: flex; align-items: center; gap: 2px; }

        /* 一级 - 红色 */
        .node-card.level1 { background: linear-gradient(135deg, #3a1a1a, #2a0a0a); border: 2px solid #ef4444; }
        .node-card.level1 .node-label { color: #ff6b6b; }
        .node-card.level1 .battery-fill { background: #ef4444; }

        /* 二级 - 蓝色 */
        .node-card.level2 { background: linear-gradient(135deg, #1a2a4a, #0a1a3a); border: 2px solid #3b82f6; }
        .node-card.level2 .node-label { color: #60a5fa; }
        .node-card.level2 .battery-fill { background: #3b82f6; }

        /* 三级 - 黄色 */
        .node-card.level3 { background: linear-gradient(135deg, #3a3a1a, #2a2a0a); border: 2px solid #eab308; }
        .node-card.level3 .node-label { color: #fde047; }
        .node-card.level3 .battery-fill { background: #eab308; }

        /* 四级 - 紫色 */
        .node-card.level4 { background: linear-gradient(135deg, #3a1a3a, #2a0a2a); border: 2px solid #a855f7; }
        .node-card.level4 .node-label { color: #c084fc; }
        .node-card.level4 .battery-fill { background: #a855f7; }

        /* 线条层 - 细线连接到图标边缘 */
        .line-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .line-layer line {
            stroke: #5b8cbf;
            stroke-width: 1.2;
            stroke-dasharray: 4,3;
            opacity: 0.5;
        }
        .line-layer line.path-highlight {
            stroke: #eab308;
            stroke-width: 1.8;
            opacity: 1;
        }

        /* 底部搜索 */
        .footer-search {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15,15,35,0.95);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid #3b82f6;
            z-index: 30;
        }
        .footer-search input { width: 250px; padding: 6px 14px; border-radius: 30px; border: none; background: rgba(30,30,60,0.8); color: white; outline: none; font-size: 0.65rem; }
        .gold-display { background: linear-gradient(135deg, #2a2a3a, #1a1a2a); padding: 6px 18px; border-radius: 30px; border: 1px solid #eab308; font-weight: bold; color: #eab308; font-size: 0.7rem; }

        /* 手机适配 */
        @media (max-width: 768px) {
            .sidebar { width: 220px; min-width: 160px; }
            .node-card { padding: 5px 12px; }
            .node-label { font-size: 0.65rem; white-space: nowrap; }
            .node-gold { font-size: 0.5rem; }
            .quote-window { max-width: 200px; min-width: 150px; top: 8px; right: 8px; }
            .quote-text { font-size: 0.6rem; }
            .toolbar button { padding: 2px 6px; font-size: 0.55rem; }
            #graphCanvas { width: 1600px; height: 1200px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧面板 -->
        <div class="sidebar" id="sidebar">
            <h1>🌌 智能知识图谱</h1>
            <div class="subtitle">AI识别笔记 · 电量灌注版</div>

            <div class="upload-area" id="uploadArea">
                <span class="upload-icon">📤</span>
                <div>点击或拖拽文件上传</div>
                <input type="file" id="fileInput" accept="image/*,.pdf,.txt" multiple style="display:none">
            </div>
            <div id="uploadResult" class="upload-result"></div>

            <div class="file-manager">
                <div class="file-header" id="fileHeader">
                    <h3>📂 文件知识库</h3>
                    <button id="downloadBtn" style="padding:2px 6px; font-size:0.5rem;">⬇️</button>
                </div>
                <div id="fileContent" class="file-content">暂无文件</div>
            </div>

            <div class="input-group">
                <input type="text" id="keywordInput" placeholder="输入知识点...">
                <button id="addBtn">➕</button>
            </div>

            <div class="preset-buttons">
                <button class="preset-btn" data-path="physics">⚛️物理</button>
                <button class="preset-btn" data-path="philosophy">📜哲学</button>
                <button class="preset-btn" data-path="ai">🤖AI</button>
                <button class="preset-btn" data-path="history">🏛️历史</button>
            </div>

            <div>
                <strong>📚 知识宇宙</strong>
                <div style="display:flex; gap:10px; font-size:0.5rem; margin:5px 0;">
                    <span><span style="background:#ef4444; display:inline-block; width:7px; height:7px; border-radius:7px;"></span> 一级</span>
                    <span><span style="background:#3b82f6; display:inline-block; width:7px; height:7px; border-radius:7px;"></span> 二级</span>
                    <span><span style="background:#eab308; display:inline-block; width:7px; height:7px; border-radius:7px;"></span> 三级</span>
                    <span><span style="background:#a855f7; display:inline-block; width:7px; height:7px; border-radius:7px;"></span> 四级</span>
                </div>
                <ul class="node-list" id="nodeList"></ul>
                <div class="node-hint">💡 点击展开/收起 | 右键删除 | 长按拖动</div>
            </div>

            <div class="recommend-section">
                <h3>💡 推荐学习 <span id="recTime" style="font-size:0.45rem;"></span></h3>
                <div id="recommendList" class="recommend-list">加载中...</div>
            </div>
        </div>

        <!-- 伸缩按钮 -->
        <div class="resize-handle" id="resizeHandle">
            <div class="handle-line"></div>
            <div class="handle-line"></div>
            <div class="handle-line"></div>
        </div>

        <!-- 右侧画布 -->
        <div class="canvas-container" id="canvasContainer">
            <div class="quote-window" id="quoteWindow">
                <div class="quote-header" id="quoteHeader">
                    <span class="quote-icon">📜</span>
                    <span class="quote-title">每日激励</span>
                    <span class="quote-toggle">▼</span>
                </div>
                <div class="quote-content">
                    <div class="quote-text" id="quoteText">加载中...</div>
                    <div class="quote-author" id="quoteAuthor"></div>
                    <div class="quote-explanation" id="quoteExplanation"></div>
                </div>
            </div>

            <div class="toolbar">
                <button id="zoomIn">🔍 +</button>
                <button id="zoomOut">🔍 -</button>
                <button id="resetView">🔄 重置</button>
                <button id="clearAll">🗑️ 清除</button>
                <span id="totalGold">💰 0</span>
            </div>

            <div class="canvas-wrapper" id="canvasWrapper">
                <svg id="lineSvg" class="line-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></svg>
                <div id="graphCanvas"></div>
            </div>
        </div>
    </div>

    <div class="footer-search">
        <input type="text" id="searchInput" placeholder="🔭 搜索知识点...">
        <div class="gold-display" id="goldDisplay">💰 0</div>
    </div>

    <script>
        // ==================== 智能知识图谱 - 电量灌注版 ====================
        let nodes = [];
        let nextId = 1;
        let dragTarget = null;
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0, dragStartLeft = 0, dragStartTop = 0;
        let dragHasMoved = false;
        let wrapperScale = 1;
        
        let extractedKeywords = new Set();
        let uploadedFiles = [];

        // 深度扩展库（支持四级）
        const expansions = {
            '量子物理': ['波粒二象性', '量子纠缠', '薛定谔方程', '海森堡不确定性', '量子隧穿'],
            '经典力学': ['牛顿三定律', '万有引力定律', '动量守恒', '能量守恒', '刚体力学'],
            '人工智能': ['机器学习', '深度学习', '神经网络', '计算机视觉', '强化学习'],
            '哲学': ['形而上学', '认识论', '伦理学', '美学', '逻辑学'],
            '机器学习': ['监督学习', '无监督学习', '强化学习', '决策树', '支持向量机'],
            '深度学习': ['卷积神经网络', '循环神经网络', '生成对抗网络', 'Transformer', '注意力机制'],
            '神经网络': ['感知机', '反向传播', '激活函数', '损失函数', '优化器'],
            '形而上学': ['本体论', '宇宙论', '自由意志', '决定论', '存在'],
            '认识论': ['知识定义', '真理理论', '怀疑论', '先验知识', '后验知识'],
            '监督学习': ['线性回归', '逻辑回归', '决策树', '随机森林', 'SVM'],
            '卷积神经网络': ['卷积层', '池化层', '全连接层', 'LeNet', 'ResNet']
        };

        const categoryMap = {
            physics: ['物理', '量子', '力学', '相对论', '牛顿'],
            philosophy: ['哲学', '形而上学', '认识论', '伦理', '美学'],
            ai: ['AI', '人工智能', '机器学习', '神经网络', '深度'],
            history: ['历史', '战争', '朝代', '革命']
        };

        // 电量进度计算
        function calculateBattery(node) {
            if (!node) return 0;
            if (extractedKeywords.has(node.label)) return 100;
            for (let kw of extractedKeywords) {
                if (node.label.includes(kw) || kw.includes(node.label)) return 70;
            }
            if (node.isAutoExpanded) return 0;
            return 0;
        }

        function calculateGold(node) {
            const battery = node.battery || 0;
            let baseGold = node.level === 1 ? 100 : (node.level === 2 ? 60 : (node.level === 3 ? 35 : 20));
            if (battery >= 100) return baseGold;
            if (battery >= 70) return Math.floor(baseGold * 0.7);
            if (battery >= 30) return Math.floor(baseGold * 0.3);
            return 0;
        }

        function updateAllBatteryAndGold() {
            for (let node of nodes) {
                node.battery = calculateBattery(node);
                node.goldValue = calculateGold(node);
            }
        }

        function updateTotalGold() {
            const total = nodes.reduce((sum, n) => sum + (n.goldValue || 0), 0);
            document.getElementById('totalGold').innerHTML = `💰 ${total}`;
        }

        // 添加节点
        function addNode(label, x, y, parentId = null, level = 1, isAutoExpanded = false) {
            if (!label || label.trim() === '') return null;
            label = label.trim();
            let existing = nodes.find(n => n.label === label);
            if (existing) return existing;
            
            let posX = x || (Math.random() * 400 + 100);
            let posY = y || (Math.random() * 250 + 100);
            
            if (parentId) {
                const parent = nodes.find(n => n.id === parentId);
                if (parent) {
                    const childCount = parent.children ? parent.children.length : 0;
                    posX = parent.x + (childCount - 2) * 110;
                    posY = parent.y + 85;
                }
            }
            
            const newNode = {
                id: nextId++,
                label: label,
                x: posX,
                y: posY,
                level: level,
                parentId: parentId,
                children: [],
                battery: 0,
                goldValue: 0,
                expanded: false,
                visible: true,
                isAutoExpanded: isAutoExpanded
            };
            newNode.battery = calculateBattery(newNode);
            newNode.goldValue = calculateGold(newNode);
            nodes.push(newNode);
            
            if (parentId) {
                const parent = nodes.find(n => n.id === parentId);
                if (parent && !parent.children.includes(newNode.id)) {
                    parent.children.push(newNode.id);
                }
            }
            
            renderAll();
            return newNode;
        }

        // 展开/收起节点（支持递归）
        function expandNode(nodeId, level) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;
            
            if (node.children && node.children.length > 0) {
                for (let childId of node.children) {
                    const child = nodes.find(n => n.id === childId);
                    if (child) child.visible = true;
                }
                node.expanded = true;
                renderAll();
                return;
            }
            
            let subs = expansions[node.label];
            if (!subs) {
                if (level === 1) subs = [`${node.label}基础`, `${node.label}进阶`, `${node.label}应用`];
                else if (level === 2) subs = [`${node.label}核心`, `${node.label}方法`, `${node.label}案例`];
                else if (level === 3) subs = [`${node.label}细节1`, `${node.label}细节2`, `${node.label}细节3`];
                else subs = [`${node.label}延伸A`, `${node.label}延伸B`];
            }
            
            if (subs) {
                for (let i = 0; i < subs.length; i++) {
                    addNode(subs[i], node.x + (i - 2) * 95, node.y + 85, node.id, level + 1, true);
                }
            }
            node.expanded = true;
            renderAll();
        }

        function collapseNode(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node || !node.children) return;
            for (let childId of node.children) {
                const child = nodes.find(n => n.id === childId);
                if (child) {
                    child.visible = false;
                    collapseNode(childId);
                }
            }
            node.expanded = false;
            renderAll();
        }

        function toggleNode(nodeId, level) {
            const node = nodes.find(n => n.id === nodeId);
            if (node.expanded) {
                collapseNode(nodeId);
            } else {
                expandNode(nodeId, level);
            }
        }

        function deleteNode(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;
            if (node.children) {
                for (let childId of [...node.children]) deleteNode(childId);
            }
            if (node.parentId) {
                const parent = nodes.find(n => n.id === node.parentId);
                if (parent && parent.children) {
                    parent.children = parent.children.filter(id => id !== nodeId);
                }
            }
            nodes = nodes.filter(n => n.id !== nodeId);
            renderAll();
            updateRecommendations();
        }

        function highlightPath(nodeId) {
            document.querySelectorAll('.node-card').forEach(el => el.classList.remove('path-highlight'));
            document.querySelectorAll('.line-layer line').forEach(line => line.classList.remove('path-highlight'));
            if (!nodeId) return;
            
            const nodeEl = document.querySelector(`.node-card[data-id='${nodeId}']`);
            if (nodeEl) nodeEl.classList.add('path-highlight');
            
            const pathIds = new Set();
            let current = nodes.find(n => n.id === nodeId);
            while (current) {
                pathIds.add(current.id);
                if (current.parentId) current = nodes.find(n => n.id === current.parentId);
                else break;
            }
            
            function addChildren(id) {
                const n = nodes.find(n => n.id === id);
                if (n && n.children) {
                    for (let childId of n.children) {
                        pathIds.add(childId);
                        addChildren(childId);
                    }
                }
            }
            addChildren(nodeId);
            
            for (let id of pathIds) {
                const el = document.querySelector(`.node-card[data-id='${id}']`);
                if (el) el.classList.add('path-highlight');
            }
            
            for (let node of nodes) {
                if (node.children) {
                    for (let childId of node.children) {
                        if (pathIds.has(node.id) && pathIds.has(childId)) {
                            const line = document.querySelector(`.line-layer line[data-from='${node.id}'][data-to='${childId}']`);
                            if (line) line.classList.add('path-highlight');
                        }
                    }
                }
            }
        }

        // 渲染 - 电量灌注效果，线条连接到图标边缘
        function renderAll() {
            const canvas = document.getElementById('graphCanvas');
            const svgLine = document.getElementById('lineSvg');
            if (!canvas) return;
            canvas.innerHTML = '';
            
            const visibleNodes = nodes.filter(n => n.visible !== false);
            
            for (let node of visibleNodes) {
                const div = document.createElement('div');
                div.className = `node-card level${Math.min(node.level, 4)}`;
                div.setAttribute('data-id', node.id);
                div.setAttribute('data-level', node.level);
                div.style.left = `${node.x}px`;
                div.style.top = `${node.y}px`;
                
                const batteryWidth = Math.min(100, node.battery || 0);
                const batteryColor = node.level === 1 ? '#ef4444' : (node.level === 2 ? '#3b82f6' : (node.level === 3 ? '#eab308' : '#a855f7'));
                
                div.innerHTML = `
                    <div class="battery-fill" style="width: ${batteryWidth}%; background: ${batteryColor};"></div>
                    <div class="content">
                        <div class="node-label">${node.label}</div>
                        <div class="node-gold">💰 ${node.goldValue || 0}</div>
                    </div>
                `;
                canvas.appendChild(div);
                
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!isDragging) toggleNode(node.id, node.level);
                });
                
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (confirm(`删除 "${node.label}"？`)) deleteNode(node.id);
                });
                
                div.addEventListener('mouseenter', () => highlightPath(node.id));
                div.addEventListener('mouseleave', () => highlightPath(null));
            }
            
            // 绘制线条 - 连接到图标边缘
            svgLine.innerHTML = '';
            const canvasRect = canvas.getBoundingClientRect();
            const wrapperRect = document.getElementById('canvasWrapper').getBoundingClientRect();
            const offsetX = canvasRect.left - wrapperRect.left;
            const offsetY = canvasRect.top - wrapperRect.top;
            
            for (let node of visibleNodes) {
                if (node.children && node.children.length) {
                    const parentDiv = document.querySelector(`.node-card[data-id='${node.id}']`);
                    if (!parentDiv) continue;
                    const parentRect = parentDiv.getBoundingClientRect();
                    const canvasRectLocal = canvas.getBoundingClientRect();
                    
                    // 计算父节点边缘位置（右侧）
                    const startX = parentRect.right - canvasRectLocal.left - 5;
                    const startY = parentRect.top + parentRect.height/2 - canvasRectLocal.top;
                    
                    for (let childId of node.children) {
                        const childDiv = document.querySelector(`.node-card[data-id='${childId}']`);
                        if (childDiv) {
                            const childRect = childDiv.getBoundingClientRect();
                            // 子节点边缘位置（左侧）
                            const endX = childRect.left - canvasRectLocal.left + 5;
                            const endY = childRect.top + childRect.height/2 - canvasRectLocal.top;
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', startX);
                            line.setAttribute('y1', startY);
                            line.setAttribute('x2', endX);
                            line.setAttribute('y2', endY);
                            line.setAttribute('data-from', node.id);
                            line.setAttribute('data-to', childId);
                            svgLine.appendChild(line);
                        }
                    }
                }
            }
            
            updateTotalGold();
            updateNodeList();
        }

        function updateNodeList() {
            const container = document.getElementById('nodeList');
            if (!container) return;
            container.innerHTML = '';
            const topNodes = nodes.filter(n => n.level === 1);
            for (let node of topNodes) {
                const li = document.createElement('li');
                li.style.borderLeftColor = '#ef4444';
                li.innerHTML = `${node.label} 💰${node.goldValue || 0}`;
                li.onclick = () => toggleNode(node.id, 1);
                container.appendChild(li);
            }
        }

        // 推荐学习自动更新
        function updateRecommendations() {
            const toLearn = nodes.filter(n => {
                const battery = n.battery || 0;
                return n.level === 2 && battery < 30 && !n.isAutoExpanded;
            });
            const recDiv = document.getElementById('recommendList');
            if (toLearn.length === 0) {
                recDiv.innerHTML = '🎉 完成探索！继续上传新文件~';
                return;
            }
            const top5 = toLearn.slice(0, 5);
            recDiv.innerHTML = top5.map(n => `<div class="recommend-item" onclick="window.toggleNode(${n.id},2)">📖 ${n.label} (${100 - (n.battery||0)}%未掌握)</div>`).join('');
            document.getElementById('recTime').innerHTML = `更新于${new Date().toLocaleTimeString()}`;
        }

        let recommendTimer;
        function startRecommendAutoUpdate() {
            if (recommendTimer) clearInterval(recommendTimer);
            recommendTimer = setInterval(updateRecommendations, 30000);
        }

        // 每日语录
        const quotes = [
            { text: "学而不思则罔，思而不学则殆。", author: "孔子", explanation: "只学习不思考就会迷惑，只思考不学习就会危险。" },
            { text: "天行健，君子以自强不息。", author: "《周易》", explanation: "宇宙不停运转，君子应效法天地，永远不断地前进。" },
            { text: "宝剑锋从磨砺出，梅花香自苦寒来。", author: "佚名", explanation: "成功需经历艰苦磨练。" },
            { text: "路漫漫其修远兮，吾将上下而求索。", author: "屈原", explanation: "道路漫长，我将不遗余力地追求探索。" },
            { text: "不积跬步，无以至千里；不积小流，无以成江海。", author: "荀子", explanation: "积累的重要性，从小做起。" },
            { text: "Stay hungry, stay foolish.", author: "Steve Jobs", explanation: "求知若饥，虚心若愚。" },
            { text: "Knowledge is power.", author: "Francis Bacon", explanation: "知识就是力量。" },
            { text: "纸上得来终觉浅，绝知此事要躬行。", author: "陆游", explanation: "书本知识终觉浅薄，亲身实践才能真知。" }
        ];
        let quoteIndex = 0;
        function updateDailyQuote() {
            const quote = quotes[quoteIndex % quotes.length];
            quoteIndex++;
            document.getElementById('quoteText').innerHTML = `“${quote.text}”`;
            document.getElementById('quoteAuthor').innerHTML = `—— ${quote.author}`;
            document.getElementById('quoteExplanation').innerHTML = `📖 ${quote.explanation}`;
            const qw = document.getElementById('quoteWindow');
            if (quote.text.length < 20) { qw.style.maxWidth = '200px'; qw.style.minWidth = '160px'; }
            else if (quote.text.length < 35) { qw.style.maxWidth = '250px'; qw.style.minWidth = '210px'; }
            else { qw.style.maxWidth = '300px'; qw.style.minWidth = '260px'; }
        }
        let quoteTimer;
        function startQuoteAutoUpdate() {
            updateDailyQuote();
            if (quoteTimer) clearInterval(quoteTimer);
            quoteTimer = setInterval(updateDailyQuote, 30 * 60 * 1000);
        }
        function initQuoteWindow() {
            const qw = document.getElementById('quoteWindow');
            const qh = document.getElementById('quoteHeader');
            qh.onclick = () => qw.classList.toggle('collapsed');
        }

        // 文件处理
        async function processFile(file) {
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.innerHTML = `📄 解析: ${file.name}...`;
            let text = `量子物理 机器学习 神经网络 哲学 认识论 ${file.name}`;
            const keywords = [...new Set(text.split(/[ ,，、]+/).filter(w => w.length > 1 && w.length < 12))].slice(0, 5);
            let category = '其他';
            for (let [cat, kwList] of Object.entries(categoryMap)) {
                if (keywords.some(kw => kwList.includes(kw))) { category = cat; break; }
            }
            uploadedFiles.push({ id: Date.now(), name: file.name, keywords: keywords, category: category });
            for (let kw of keywords) extractedKeywords.add(kw);
            updateAllBatteryAndGold();
            for (let kw of keywords) {
                if (!nodes.some(n => n.label === kw)) addNode(kw);
            }
            resultDiv.innerHTML = `✅ ${file.name}<br>📌 提取: ${keywords.join(', ')}`;
            renderAll();
            updateRecommendations();
            updateFileManager();
        }

        function updateFileManager() {
            const container = document.getElementById('fileContent');
            if (uploadedFiles.length === 0) { container.innerHTML = '暂无文件'; return; }
            container.innerHTML = uploadedFiles.map(f => `<div class="file-item"><span>📄 ${f.name.substring(0, 20)}</span><span class="delete-file" onclick="deleteFile(${f.id})">🗑️</span></div>`).join('');
        }
        function deleteFile(fileId) {
            uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
            extractedKeywords.clear();
            for (let f of uploadedFiles) for (let kw of f.keywords) extractedKeywords.add(kw);
            updateAllBatteryAndGold();
            updateFileManager();
            renderAll();
            updateRecommendations();
        }
        function downloadAllFiles() {
            let content = "知识库导出\n\n";
            for (let f of uploadedFiles) content += `文件: ${f.name}\n关键词: ${f.keywords.join(', ')}\n\n`;
            const blob = new Blob([content], {type: 'text/plain'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `知识库_${Date.now()}.txt`;
            link.click();
        }

        function searchNode(keyword) {
            if (!keyword) { document.getElementById('goldDisplay').innerHTML = '💰 0'; return; }
            const found = nodes.find(n => n.label.toLowerCase().includes(keyword.toLowerCase()));
            if (found) {
                document.getElementById('goldDisplay').innerHTML = `💰 ${found.goldValue || 0}`;
                highlightPath(found.id);
                setTimeout(() => highlightPath(null), 2000);
            } else { document.getElementById('goldDisplay').innerHTML = '💰 0'; }
        }

        // 缩放和清除
        let currentZoom = 1;
        function zoom(delta) {
            currentZoom = Math.min(2.5, Math.max(0.4, currentZoom + delta));
            document.getElementById('graphCanvas').style.transform = `scale(${currentZoom})`;
            setTimeout(() => renderAll(), 60);
        }
        function resetView() { currentZoom = 1; document.getElementById('graphCanvas').style.transform = 'scale(1)'; setTimeout(() => renderAll(), 60); }
        function clearAll() { nodes = []; nextId = 1; extractedKeywords.clear(); uploadedFiles = []; renderAll(); updateFileManager(); updateRecommendations(); }

        // 无限缩放（双指/滚轮）
        function initPinchZoom() {
            const wrapper = document.getElementById('canvasWrapper');
            wrapper.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    zoom(e.deltaY > 0 ? -0.05 : 0.05);
                }
            }, { passive: false });
        }

        // 拖拽
        function initDrag() {
            document.addEventListener('mousedown', (e) => {
                const node = e.target.closest('.node-card');
                if (!node) return;
                dragTarget = node;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragStartLeft = parseInt(node.style.left);
                dragStartTop = parseInt(node.style.top);
                dragHasMoved = false;
                isDragging = false;
                node.style.cursor = 'grabbing';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!dragTarget) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                if (!dragHasMoved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
                    dragHasMoved = true;
                    isDragging = true;
                    dragTarget.classList.add('dragging');
                }
                if (dragHasMoved) {
                    const newLeft = dragStartLeft + dx;
                    const newTop = dragStartTop + dy;
                    dragTarget.style.left = `${newLeft}px`;
                    dragTarget.style.top = `${newTop}px`;
                    const nodeId = parseInt(dragTarget.getAttribute('data-id'));
                    const node = nodes.find(n => n.id === nodeId);
                    if (node) { node.x = newLeft; node.y = newTop; }
                    renderAll();
                }
            });
            document.addEventListener('mouseup', () => {
                if (dragTarget) { dragTarget.classList.remove('dragging'); dragTarget.style.cursor = ''; dragTarget = null; }
                isDragging = false; dragHasMoved = false;
            });
        }

        // 侧边栏伸缩
        function initResize() {
            const handle = document.getElementById('resizeHandle');
            const sidebar = document.getElementById('sidebar');
            let startX, startWidth, resizing = false;
            handle.addEventListener('mousedown', (e) => { startX = e.clientX; startWidth = sidebar.offsetWidth; resizing = true; document.body.style.cursor = 'ew-resize'; e.preventDefault(); });
            document.addEventListener('mousemove', (e) => { if (!resizing) return; let w = startWidth + (e.clientX - startX); w = Math.min(450, Math.max(160, w)); sidebar.style.width = w + 'px'; });
            document.addEventListener('mouseup', () => { resizing = false; document.body.style.cursor = ''; });
        }

        function addPreset(type) {
            const presets = { physics: ['量子物理', '经典力学', '相对论'], philosophy: ['哲学', '形而上学', '认识论'], ai: ['人工智能', '机器学习', '深度学习'], history: ['古代史', '中世纪史', '近代史'] };
            for (let topic of (presets[type] || [])) if (!nodes.some(n => n.label === topic)) addNode(topic);
        }

        function initDemo() {
            addNode('量子物理', 300, 180, null, 1);
            addNode('经典力学', 550, 180, null, 1);
            addNode('人工智能', 420, 350, null, 1);
            addNode('哲学', 150, 320, null, 1);
        }

        function bindEvents() {
            document.getElementById('addBtn').onclick = () => { const inp = document.getElementById('keywordInput'); if (inp.value.trim()) addNode(inp.value.trim()); inp.value = ''; };
            document.getElementById('zoomIn').onclick = () => zoom(0.1);
            document.getElementById('zoomOut').onclick = () => zoom(-0.1);
            document.getElementById('resetView').onclick = resetView;
            document.getElementById('clearAll').onclick = clearAll;
            document.getElementById('searchInput').oninput = (e) => searchNode(e.target.value);
            document.getElementById('downloadBtn').onclick = downloadAllFiles;
            document.querySelectorAll('.preset-btn').forEach(btn => btn.onclick = () => addPreset(btn.getAttribute('data-path')));
            const uploadArea = document.getElementById('uploadArea'), fileInput = document.getElementById('fileInput');
            uploadArea.onclick = () => fileInput.click();
            uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = '#60a5fa'; };
            uploadArea.ondragleave = () => uploadArea.style.borderColor = '#3b82f6';
            uploadArea.ondrop = (e) => { e.preventDefault(); for (let f of e.dataTransfer.files) processFile(f); };
            fileInput.onchange = (e) => { for (let f of e.target.files) processFile(f); };
            const fh = document.getElementById('fileHeader'), fc = document.getElementById('fileContent');
            fh.onclick = (e) => { if (e.target.tagName !== 'BUTTON') fc.style.display = fc.style.display === 'none' ? 'block' : 'none'; };
        }

        window.toggleNode = toggleNode;
        window.deleteFile = deleteFile;

        initDrag();
        initResize();
        initPinchZoom();
        initQuoteWindow();
        bindEvents();
        startQuoteAutoUpdate();
        startRecommendAutoUpdate();
        initDemo();
    </script>
</body>
</html>
